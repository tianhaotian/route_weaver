
      <details open><summary>车上与行李清单 <span>＋</span></summary><div class="details-body"><ul class="plain-list"><li>羽绒服、抓绒、防风外套，分层穿脱。</li><li>帽子、手套、防滑鞋和备用袜子。</li><li>保温杯、饮用水与常备简餐。</li><li>检查轮胎状况及低温适用性，补适温玻璃水。</li><li>下载离线地图，收藏主充电站和备用站。</li></ul><p class="inline-note">雨雪、结冰和复杂林区路段不要依赖 NOA；四驱不能替代轮胎抓地力。拍照不驶入草地或林地。</p></div></details>
